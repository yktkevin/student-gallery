
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>電子DM展</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, "Noto Sans TC", sans-serif;
  background: #f5f6fa;
  color: #253047;
}

header {
  background: #243b55;
  color: white;
  text-align: center;
  padding: 55px 20px;
}

header h1 {
  font-size: 32px;
}

header p {
  font-size: 17px;
}

nav {
  position: sticky;
  top: 0;
  background: white;
  padding: 15px;
  text-align: center;
  box-shadow: 0 2px 8px #ddd;
  z-index: 10;
}

nav a {
  display: inline-block;
  margin: 5px 10px;
  color: #243b55;
  text-decoration: none;
  font-weight: bold;
}

section {
  max-width: 1100px;
  margin: 35px auto;
  padding: 25px;
  background: white;
  border-radius: 14px;
  scroll-margin-top: 80px;
}

section h2 {
  color: #243b55;
  border-bottom: 2px solid #ddd;
  padding-bottom: 12px;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  align-items: start;
}

.gallery img {
  width: 100%;
  height: auto;
  display: block;
  object-fit: contain;
  border-radius: 10px;
}

.description {
  color: #64748b;
  line-height: 1.8;
}

footer {
  background: #243b55;
  color: white;
  text-align: center;
  padding: 25px;
}

@media(max-width: 650px) {
  .gallery {
    grid-template-columns: repeat(2, 1fr);
  }

  header h1 {
    font-size: 25px;
  }

  .gallery img {
    height: 160px;
  }

  section {
    margin: 20px 12px;
    padding: 18px;
  }
}
</style>
</head>

<body>

<header>
  <h1>🎨 電子DM展</h1>
  <p>Student Creative Project Exhibition</p>
  <p>探索四組學生的創意與成果</p>
</header>

<nav>
  <a href="#group1">第一組</a>
  <a href="#group2">第二組</a>
  <a href="#group3">第三組</a>
  <a href="#group4">第四組</a>
</nav>

<section id="group1">
  <h2>第一組｜電子DM展</h2>
  <p class="description">
    這裡放入第一組的學生介紹與作品說明。
  </p>
  <div class="gallery">
    <img src="images/group1-1.jpg" alt="第一組作品1">
    <img src="images/group1-2.jpg" alt="第一組作品2">
    <img src="images/group1-3.jpg" alt="第一組作品3">
  </div>
</section>

<section id="group2">
  <h2>第二組｜電子DM展</h2>
  <p class="description">
    這裡放入第二組的學生介紹與作品說明。
  </p>
  <div class="gallery">
    <img src="images/group2-1.jpg" alt="第二組作品1">
    <img src="images/group2-2.jpg" alt="第二組作品2">
    <img src="images/group2-3.jpg" alt="第二組作品3">
  </div>
</section>

<section id="group3">
  <h2>第三組｜電子DM展</h2>
  <p class="description">
    這裡放入第三組的學生介紹與作品說明。
  </p>
  <div class="gallery">
    <img src="images/group3-1.jpg" alt="第三組作品1">
    <img src="images/group3-2.jpg" alt="第三組作品2">
    <img src="images/group3-3.jpg" alt="第三組作品3">
  </div>
</section>

<section id="group4">
  <h2>第四組｜電子DM展</h2>
  <p class="description">
    這裡放入第四組的學生介紹與作品說明。
  </p>
  <div class="gallery">
    <img src="images/group4-1.jpg" alt="第四組作品1">
    <img src="images/group4-2.jpg" alt="第四組作品2">
    <img src="images/group4-3.jpg" alt="第四組作品3">
  </div>
</section>

<footer>
  <p>電子DM展｜University Student Exhibition</p>
</footer>

</body>
</html>
